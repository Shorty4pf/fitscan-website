<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoraX AI — Connexion</title>
    <style>
        :root { color-scheme: light; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f5f7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #111827;
        }
        main {
            width: min(440px, calc(100% - 32px));
            background: #fff;
            border: 1px solid #e8eaef;
            border-radius: 16px;
            padding: 32px 28px;
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
        }
        p.brand { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.02em; color: #6b7280; }
        h1 { margin: 12px 0 0; font-size: 24px; line-height: 1.3; }
        p { margin: 14px 0 0; font-size: 15px; line-height: 1.6; color: #4b5563; }
        .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 24px; }
        a.button {
            display: block;
            text-align: center;
            text-decoration: none;
            border-radius: 10px;
            padding: 14px 18px;
            font-size: 15px;
            font-weight: 600;
        }
        a.primary { background: #4f46e5; color: #fff; }
        a.secondary { background: #fff; color: #111827; border: 1px solid #d1d5db; }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
    <main>
        <p class="brand">NoraX AI</p>
        <h1 id="title">Ouvrir NoraX AI</h1>
        <p id="message">Ouverture de l’application…</p>
        <div class="actions" id="actions" hidden>
            <a class="button primary" id="open-app" href="#">Ouvrir NoraX AI</a>
            <a class="button secondary" id="store" href="https://apps.apple.com/app/norax-ai/id6776386015">Télécharger sur l’App Store</a>
        </div>
    </main>
    <script>
      (function () {
        var STORE = "https://apps.apple.com/app/norax-ai/id6776386015";

        function decodeChain(value) {
          var current = value;
          for (var i = 0; i < 3; i++) {
            try {
              var decoded = decodeURIComponent(current);
              if (decoded === current) break;
              current = decoded;
            } catch (e) {
              break;
            }
          }
          return current;
        }

        function authURLFrom(raw) {
          var current = raw;
          for (var depth = 0; depth < 3; depth++) {
            var parsed;
            try { parsed = new URL(current); } catch (e) { return null; }
            if (parsed.searchParams.get("oobCode") && parsed.searchParams.get("mode") === "signIn") {
              return parsed.toString();
            }
            var nested = parsed.searchParams.get("link") || parsed.searchParams.get("deep_link_id");
            if (!nested) return null;
            current = decodeChain(nested);
          }
          return null;
        }

        function appURL(authURL) {
          var source = new URL(authURL);
          var target = new URL("norax://email-link");
          target.searchParams.set("link", authURL);
          source.searchParams.forEach(function (value, key) {
            target.searchParams.append(key, value);
          });
          return target.toString();
        }

        var authURL = authURLFrom(window.location.href);
        var title = document.getElementById("title");
        var message = document.getElementById("message");
        var actions = document.getElementById("actions");
        var openApp = document.getElementById("open-app");
        document.getElementById("store").href = STORE;

        if (!authURL) {
          title.textContent = "Connexion incomplète";
          message.textContent = "Ce lien ne contient pas les informations de connexion. Demandez un nouveau lien depuis l’application NoraX AI.";
          actions.hidden = false;
          openApp.hidden = true;
          return;
        }

        openApp.href = appURL(authURL);
        message.textContent = "Si NoraX AI ne s’est pas ouverte automatiquement, utilisez le bouton ci-dessous. Il transmet le lien complet à l’application.";
        actions.hidden = false;
      })();
    </script>
</body>
</html>
